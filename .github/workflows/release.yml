name: Release

# Cut a stable release from a v* tag (pushed on the main branch): runs the SAME reusable build
# pipelines as nightly (build.yml, build-linux.yml, build-macos.yml — no gate, this is
# already-merged code), then publishes a DRAFT GitHub Release with the packaged Windows ZIP, Linux
# AppImage and macOS DMG attached. macOS does not hold the release back: if its build fails, the
# draft is published without the DMG.
# Draft so you can review/edit notes before publishing. See docs/UPSTREAM_MERGES.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    uses: ./.github/workflows/build.yml
    with:
      release_zip: true # the publish job below attaches this artifact as the Release asset

  linux:
    uses: ./.github/workflows/build-linux.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  publish:
    needs: [windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-package-zip
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-linux-appimage
          path: dist

      - name: Download macOS DMG
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-macos
          path: dist

      - name: Name the assets after the tag
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip | head -1)
          mv "$zip" "dist/WomboComboShip-${GITHUB_REF_NAME}-windows.zip"
          appimage=$(ls dist/ComboShip-*-linux-x86_64.AppImage | head -1)
          mv "$appimage" "dist/WomboComboShip-${GITHUB_REF_NAME}-linux-x86_64.AppImage"
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if ((${#dmgs[@]})); then
            mv "${dmgs[0]}" "dist/WomboComboShip-${GITHUB_REF_NAME}-macos.dmg"
          fi

      # WomboComboShip: publish directly as a pre-release (this job only runs once the Windows and Linux builds
      # succeeded), with the fork disclaimer and the early-build warning instead of generated notes.
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          fail_on_unmatched_files: false # the DMG is absent when the macOS build failed
          generate_release_notes: false
          body: |
            **WomboComboShip ${{ github.ref_name }}: an early public test build, not a finished release.**

            - **Bugs are expected.** Crashes and behaviour that doesn't yet match the original games will happen.
            - **Please report inaccuracies.** Every move, item, sound, animation and enemy is meant to behave 1:1 like
              its home game. If something differs, open an issue with what you did, what the original game does,
              and what happened.
            - **Not competition-ready yet.** Don't use this build for races or leaderboards.

            **Unofficial fan build.** WomboComboShip is a fork of [junkx420's ComboShip co-op fork](https://github.com/junkx420/ComboShip),
            itself a fork of [ComboShip](https://github.com/Varuuna/ComboShip) by [Varuuna](https://github.com/Varuuna).
            Not affiliated with ComboShip, HarbourMasters or 2 Ship 2 Harkinian, so please report problems here, not
            upstream. See the README for what this fork adds.

            Co-op: every player needs this same build. You need your own Ocarina of Time and Majora's Mask ROMs.

            Downloads: Windows `.zip`, Linux `.AppImage` (`chmod +x` it, then run), macOS `.dmg` if that build succeeded.
          files: |
            dist/WomboComboShip-${{ github.ref_name }}-windows.zip
            dist/WomboComboShip-${{ github.ref_name }}-linux-x86_64.AppImage
            dist/WomboComboShip-${{ github.ref_name }}-macos.dmg
